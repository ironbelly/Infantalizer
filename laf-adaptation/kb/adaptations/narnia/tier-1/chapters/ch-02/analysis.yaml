summary:
  text: "Lucy and the Faun — now named Mr. Tumnus — strike up a warm acquaintance at the lamp-post; he confirms she is a Human ('Daughter of Eve'), tells her she is in Narnia, and invites her home to tea. At his cosy firelit cave he lays a splendid tea and tells enchanting tales of forest life before playing a flute so bewitching that Lucy loses hours to it. Rousing at last, she says she must go home — and Tumnus dissolves into tears, confessing that he is in the pay of the White Witch (who holds Narnia in endless winter, always winter and never Christmas) and has been ordered to kidnap any Human he meets and hand them to her. Lucy is the first, and he had meant to lull her asleep and betray her. But having come to know her as a friend, he repents, cannot go through with it, and leads her quietly back through the spy-ridden wood to the lamp-post. Lucy forgives him, they part with a handshake, and she runs back to the wardrobe, tumbling into the same empty room to call out that she has returned safe."
