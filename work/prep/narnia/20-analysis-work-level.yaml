summary:
  text: "During wartime air-raids, four siblings (Peter, Susan, Edmund, Lucy) are evacuated to an old Professor's country house. Exploring a dusty wardrobe, Lucy stumbles into Narnia, a land held in the White Witch's enchantment of eternal winter with no Christmas, where she befriends the Faun Mr. Tumnus, who risks his life to spare her. Edmund, bewitched by the Witch's enchanted Turkish Delight, becomes her tool and betrays the others. When all four enter Narnia fleeing the housekeeper, talking Beavers guide them toward the returning great Lion Aslan, son of the Emperor-Beyond-the-Sea, whose coming breaks the winter into spring. The Witch claims Edmund under the immutable Deep Magic that gives her 'a right to a kill' for every traitor; Aslan secretly bargains with her and allows himself to be shaved, bound, mocked, and slain on the Stone Table in Edmund's stead. At dawn, field mice gnaw his bonds and the Table cracks: a Deeper Magic, older than the Witch's knowledge, resurrects the willing, guiltless victim. Restored, Aslan revives the Witch's petrified victims and races to the Battle of Beruna, where Edmund shatters the Witch's wand and Aslan slays her. The four are crowned at Cair Paravel, reign in a golden age, then return through the wardrobe to the very hour they left, the Professor quietly believing them."
  confidence: PROBABLE
