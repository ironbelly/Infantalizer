    note: "Peter's killing of the wolf Fenris Ulf (sword through the heart, blood and heat and hair described); the Witch binding, shaving, muzzling, kicking, hitting, and spitting on Aslan; the Witch preparing to slit Edmund's throat (knife sharpened); the Battle of Beruna (clashing metal, battle-axes, crushing, the Witch fighting Peter with her stone knife); Edmund wounded and bloody and smashing the Witch's wand; Aslan leaping on and killing the Witch. Presented in a children's-book register (restrained, not graphic), hence med rather than high."
  death:
    instances: 4
    severity: high
    note: "Aslan is murdered on the Stone Table in Edmund's place (the explicit killing, described as sacrifice); the White Witch is killed by Aslan in battle; Fenris Ulf is killed by Peter; many of the enemy are killed in the first charge ('most of the enemy had been killed'). The Witch also 'turns to stone' numerous living creatures, a kind of living death. Aslan's death and resurrection is the high-severity emotional and thematic centre."
  emotional:
    instances: 7
    severity: high
    note: "Aslan's willing sacrifice, the shaving/muzzling/mockery, and Susan and Lucy's vigil over his dead body (crying till they could cry no more) are the high point; also Lucy's first misery at being disbelieved, Edmund's shame and repentance, the children's reunion with the restored Tumnus, Aslan's quiet slipping away at the coronation, and the bittersweet return through the wardrobe."
  abstract:
    instances: 5
    severity: high
    note: "The Deep Magic from the Dawn of Time and the Deeper Magic from before the Dawn of Time (the metaphysical law governing treachery, blood-debt, and resurrection via a willing innocent victim); the prophecies of Cair Paravel's four thrones and 'Adam's flesh and Adam's bone'; the Witch's enchantments (eternal winter, turning to stone, the enchanted Turkish Delight); Aslan as son of the Emperor-Beyond-the-Sea. This is the explicit allegorical machinery of the novel and must be neither added to nor stripped."
meaning:
  value: "A Christian redemption allegory layered beneath a fairy-tale adventure: Aslan's voluntary, substitutionary sacrifice of himself in the traitor Edmund's place, his resurrection on the third dawn by a deeper law older than the enemy's knowledge, and his triumphant defeat of evil map onto the Passion, Atonement, and Resurrection of Christ (Aslan as the Christ-figure, son of the Emperor-Beyond-the-Sea = God the Father). Intertwined is a coming-of-age / faith-and-betrayal-and-forgiveness theme: Edmund's fall (temptation, betrayal) and restoration, the children's growth into just and magnanimous rulers ('once a king or queen in Narnia, always a king or queen'), and the virtue of truthful belief (Lucy) over cynical disbelief. The frame also affirms childlike wonder and the existence of a magical reality just beyond the ordinary world. Adaptations must neither add explicit religious content the text keeps veiled NOR strip the sacrificial-redemption structure, the Deep/Deeper Magic, or the moral arc of betrayal-forgiveness."
  confidence: CERTAIN
