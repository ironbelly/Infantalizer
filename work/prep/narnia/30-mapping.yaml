concepts:
  the_wardrobe_threshold:                        # the portal — fixture-grounded
    tier_1: "A magic cupboard that goes to a snowy land"
    tier_2: "A magical wardrobe that is the door into Narnia"
    tier_3: "The wardrobe — the portal between wartime England and Narnia"
    tier_5: "The wardrobe — the threshold between the Professor's spare room and the lantern-lit snowy wood of Narnia; it returns you to the same hour you left"
    _confidence: {text: CERTAIN, context: PROBABLE, eff: PROBABLE}

  eternal_winter:                                # the Witch's enchantment
    tier_1: "Always winter and no fun — always snowing, never Christmas (until the sun came back)"
    tier_2: "An endless cold winter with no Christmas, that the Witch's magic keeps"
    tier_3: "The Witch's enchantment of eternal winter with no Christmas, broken by Aslan's coming and Father Christmas's arrival"
    tier_5: "The White Witch's enchantment — eternal winter and always winter, never Christmas; the Deep Magic of her reign, thawing only as Aslan draws near"
    _confidence: {text: CERTAIN, context: PROBABLE, eff: PROBABLE}

  the_deep_magic:                                # the abstract law — allegorical machinery (allegory-as-reception: nameable at T3+)
    tier_1: "OMIT (a grown-up rule) — Aslan just knew how to help"
    tier_2: "A rule the Witch thought gave her Edmund (lightly: a rule that said mean choices have a cost)"
    tier_3: "The Deep Magic from the Dawn of Time — the law that gives the Witch a right to a traitor's blood; at this tier its echo of Law (the claim that must be satisfied) may be named openly as the allegorical resonance"
    tier_5: "The Deep Magic from the Dawn of Time — the immutable law by which every traitor is the Witch's lawful prey and she has a right to a kill; preserve as written (the allegorical echo of Law is openly acknowledged at this tier)"
    _confidence: {text: CERTAIN, context: PROBABLE, eff: PROBABLE}

  the_deeper_magic:                              # the reversal — allegorical machinery (allegory-as-reception: nameable at T3+)
    tier_1: "OMIT — Aslan just came back because he was good"
    tier_2: "Something deeper than the Witch knew that let Aslan come back (lightly)"
    tier_3: "The Deeper Magic from before the Dawn of Time — when a willing, guiltless victim dies in a traitor's stead, Death works backwards; at this tier its resonance with Grace and the Resurrection may be named openly"
    tier_5: "The Deeper Magic from before the Dawn of Time — 'when a willing victim who had committed no treachery was killed in a traitor's stead, Death itself would start working backwards'; preserve as written (the Resurrection echo is openly acknowledged at this tier)"
    _confidence: {text: CERTAIN, context: PROBABLE, eff: PROBABLE}

  petrification_to_stone:                        # the Witch's living-death
    tier_1: "A 'very long nap' / frozen like ice until Aslan wakes you"
    tier_2: "Turned to stone — an enchantment Aslan can undo"
    tier_3: "Turned to stone by the Witch — a living death reversed by Aslan's breath; the courtyard of statues and the restoration"
    tier_5: "The Witch turns the living to stone (a courtyard of statues, including the lion the dwarf dressed and mocked); Aslan's breath restores each one"
    _confidence: {text: CERTAIN, context: PROBABLE, eff: PROBABLE}

