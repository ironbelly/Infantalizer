    tier_5: {approach: "Preserve — the coronation (Peter the Magnificent, Susan the Gentle, Edmund the Just, Lucy the Valiant), the long golden reign, the White Stag hunt, the rediscovery of the lamp-post, the return to the same day and hour, the Professor's belief"}
